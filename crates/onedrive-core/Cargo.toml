[package]
name = "onedrive-core"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
toml = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
