[package]
name = "onedrive-rs"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
onedrive-core = { path = "../onedrive-core" }
onedrive-graph = { path = "../onedrive-graph" }
rustix = { version = "1", features = ["fs", "net", "process"] }
tokio = { version = "1", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
